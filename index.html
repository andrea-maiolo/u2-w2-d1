<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>

    <h1 class="text-center">Pratica con il grid system</h1>

    <div class="container mb-4">
        <h2 class="text-center">Esercizio 1</h2>
        <div class="row gap-1">
            <div class="col-md bg-primary text-light p-3 border border-black">1</div>
            <div class="col-md bg-primary text-light p-3  border border-black">1</div>
            <div class="col-md bg-primary text-light p-3  border border-black">1</div>
        </div>
        <h2 class="text-center">Esercizio 2</h2>
        <div class="row">
            <div class="col-md-4 bg-warning text-black p-3 border border-black">1</div>
            <div class="col-md-4 bg-warning text-black  p-3  border border-black">1</div>
            <div class="col-md-4 bg-warning text-black  p-3  border border-black">1</div>
        </div>
        <h2 class="text-center">Esercizio 3</h2>
        <div class="row">
            <div class="col-4 bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-4 bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-4 bg-success text-light p-3  border border-black">ciao</div>
        </div>
        <div class="row">
            <div class="col-sm bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-sm bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-sm bg-success text-light p-3  border border-black">ciao</div>
        </div>
        <div class="row">
            <div class="col-md bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-md bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-md bg-success text-light p-3  border border-black">ciao</div>
        </div>
        <div class="row">
            <div class="col-lg bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-lg bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-lg bg-success text-light p-3  border border-black">ciao</div>
        </div>
        <div class="row">
            <div class="col-xl bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-xl bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-xl bg-success text-light p-3  border border-black">ciao</div>
        </div>
        <div class="row">
            <div class="col-xxl bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-xxl bg-success text-light p-3  border border-black">ciao</div>
            <div class="col-xxl bg-success text-light p-3  border border-black">ciao</div>
        </div>
        <!-- xs: 0,
        sm: 576px,
        md: 768px,
        lg: 992px,
        xl: 1200px,
        xxl: 1400px -->
        <h2 class="text-center">Esercizio 4</h2>
        <div class="row">
            <div class="col-5 bg-danger text-light p-3 border border-black">1</div>
            <div class="col-2 bg-danger text-light p-3 border border-black">1</div>
            <div class="col-5 bg-danger text-light p-3 border border-black">1</div>
        </div>
        <h2 class="text-center">Esercizio 5</h2>
        <div class="row">
            <div class="col-xl-5 bg-info text-light p-3 border border-black">1</div>
            <div class="row col-xl-7 bg-info text-light p-3 border border-black">
                <div class="col-xl-6 bg-secondary">1</div>
                <div class="col-xl-6 bg-secondary">1</div>
            </div>
        </div>
        <h2 class="text-center">Esercizio 5</h2>
        <div class="row">
            <div class="col-xl-6 p-3 text-light bg-dark">1</div>
            <div class="col-xl p-3 text-light bg-dark offset-2">1</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</body>

</html>
